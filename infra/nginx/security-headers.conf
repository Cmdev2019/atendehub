# ─────────────────────────────────────────────────────────────────────────────
# Cabeçalhos de segurança do front (B-43) — incluído no server do app.
# Fica num arquivo à parte porque um `add_header` dentro de um `location`
# ANULA todos os herdados do `server` (regra do nginx): todo `location` que
# tiver `add_header` próprio precisa incluir este arquivo de novo.
#
# Só para o host do app. As respostas da API já saem com os cabeçalhos do
# helmet (apps/api/src/main.ts) — repetir aqui duplicaria os cabeçalhos.
# ─────────────────────────────────────────────────────────────────────────────

add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options    "nosniff" always;
add_header X-Frame-Options           "DENY" always;
add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
add_header Permissions-Policy        "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

# CSP: o bundle do Vite só carrega script e CSS de arquivo próprio — nada
# inline. connect-src libera a API (REST + WebSocket) e o Sentry. img-src e
# media-src liberam o host de mídia (C-07/B-59); img-src também a CDN do
# WhatsApp, de onde vêm as fotos de perfil de contatos e conexões
# (pps.whatsapp.net).
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob: https://media.atendehub.com https://*.whatsapp.net; media-src 'self' blob: https://media.atendehub.com; font-src 'self' data:; connect-src 'self' https://api.atendehub.com wss://api.atendehub.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

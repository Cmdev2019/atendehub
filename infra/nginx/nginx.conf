# ─────────────────────────────────────────────────────────────────────────────
# AtendeHub — Nginx (produção)
# ─────────────────────────────────────────────────────────────────────────────

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Não anuncia a versão do nginx em cabeçalho nem em página de erro
    server_tokens off;

    # Logs
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    keepalive_timeout 65;
    gzip on;
    gzip_types text/plain application/json application/javascript text/css;

    # Tamanho máximo de upload (mídias do WhatsApp)
    client_max_body_size 64M;

    # ── TLS (B-43) ──────────────────────────────────────────────────────────
    # Perfil "intermediate" da Mozilla. Sem OCSP stapling: a Let's Encrypt
    # encerrou o OCSP em 2025, e com certificado dela a diretiva só gera aviso.
    ssl_protocols             TLSv1.2 TLSv1.3;
    ssl_ciphers               ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_cache         shared:SSL:10m;
    ssl_session_timeout       1d;
    ssl_session_tickets       off;
    ssl_certificate           /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key       /etc/nginx/certs/privkey.pem;

    # ── Limite de requisições por IP (B-43) ─────────────────────────────────
    # Primeira barreira, antes de gastar CPU do Node; o limite fino (por
    # usuário, por rota) continua na API. Valores folgados de propósito: um
    # escritório inteiro atrás de NAT sai com um único IP.
    # Se um balanceador/CDN entrar na frente, configurar set_real_ip_from,
    # senão todo mundo vira o IP dele.
    limit_req_zone $binary_remote_addr zone=api_geral:10m rate=20r/s;
    limit_req_zone $binary_remote_addr zone=api_auth:10m  rate=30r/m;
    limit_req_status 429;

    # WebSocket: só pede upgrade quando o cliente pediu; nos demais, Connection
    # vazio, o que deixa o keepalive com a API funcionar. Antes, todo request
    # da API ia com "Connection: upgrade" fixo.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream api {
        server api:3001;
        keepalive 32;
    }

    # ── Storage da mídia (B-64) ─────────────────────────────────────────────
    # Cloudflare R2. O upstream `media_storage` e a variável
    # $media_storage_host são gerados no boot do container a partir de
    # templates/media-storage.conf.template, com o host da conta em
    # MEDIA_STORAGE_HOST (fora do repositório). O resolver é o DNS interno do
    # Docker, usado pelo `resolve` do upstream.
    resolver 127.0.0.11 valid=60s ipv6=off;
    resolver_timeout 5s;
    include /etc/nginx/conf.d/media-storage.conf;

    # ── Host desconhecido: recusa (B-43) ────────────────────────────────────
    # Sem isso, qualquer Host (ou o IP puro) caía no primeiro server do app.
    server {
        listen 80 default_server;
        server_name _;
        return 444;
    }

    server {
        listen 443 ssl default_server;
        server_name _;
        ssl_reject_handshake on;
    }

    # ── HTTP → HTTPS (app e API) ────────────────────────────────────────────
    server {
        listen 80;
        server_name app.atendehub.com api.atendehub.com media.atendehub.com;

        return 301 https://$host$request_uri;
    }

    # ── Front-end (Vite + React — build estático, sem servidor Node) ──────────
    server {
        listen 443 ssl;
        http2 on;
        server_name app.atendehub.com;

        include /etc/nginx/security-headers.conf;

        root /usr/share/nginx/html;
        index index.html;

        # Assets com hash no nome (Vite) podem ser cacheados de forma agressiva.
        # O add_header daqui anula os herdados — por isso o include de novo.
        location /assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            include /etc/nginx/security-headers.conf;
        }

        # SPA: qualquer rota que não seja um arquivo real cai no index.html
        # (roteamento é feito no cliente)
        location / {
            try_files $uri $uri/ /index.html;
        }
    }

    # ── Mídia (C-07/B-59/B-64) — fotos, áudios, vídeos e documentos do chat ──
    # O navegador baixa daqui, com URL assinada pela API; o bucket é privado
    # (B-38), então só URL assinada e dentro do prazo funciona. A assinatura
    # V4 inclui o host, e o R2 só aceita URL assinada no host S3 da conta
    # (não em domínio próprio): a API assina com esse host e troca só a
    # origem da URL por este domínio (MINIO_PUBLIC_ENDPOINT), e aqui o Host
    # volta a ser o do R2 antes de repassar.
    # O nome do bucket (MINIO_BUCKET) aparece no location: trocar um exige
    # trocar o outro.
    server {
        listen 443 ssl;
        http2 on;
        server_name media.atendehub.com;

        # Arquivo enviado por cliente: nunca interpretar como página. sandbox
        # impede script até se alguém abrir o link direto numa aba.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Content-Type-Options    "nosniff" always;
        add_header Content-Security-Policy   "default-src 'none'; sandbox" always;
        add_header Referrer-Policy           "no-referrer" always;

        location /atendehub-media/ {
            # Só leitura: upload e exclusão não passam por aqui (a API fala
            # direto com o R2).
            limit_except GET {
                deny all;
            }
            proxy_http_version      1.1;
            proxy_set_header        Host          $media_storage_host;
            proxy_set_header        Connection    "";
            # A autenticação é só a da URL assinada: cookie ou Authorization
            # de quem abriu o link não seguem para o storage.
            proxy_set_header        Cookie        "";
            proxy_set_header        Authorization "";
            proxy_ssl_server_name   on;
            proxy_ssl_name          $media_storage_host;
            proxy_ssl_verify        on;
            proxy_ssl_verify_depth  3;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_buffering         off;
            proxy_request_buffering off;
            # Se o storage mandar os próprios HSTS/nosniff/CSP, sem esconder
            # eles saem duplicados com os de cima.
            proxy_hide_header       Strict-Transport-Security;
            proxy_hide_header       X-Content-Type-Options;
            proxy_hide_header       Content-Security-Policy;
            proxy_pass              https://media_storage;
        }

        location / {
            return 404;
        }
    }

    # ── Backend NestJS ───────────────────────────────────────────────────────
    # Cabeçalhos de segurança das respostas vêm do helmet, na própria API.
    # Todos os proxy_set_header ficam no server: um proxy_set_header dentro de
    # um location anula os herdados (mesma regra do add_header), e os
    # X-Forwarded-* sumiriam — a API depende deles para saber o IP do cliente.
    server {
        listen 443 ssl;
        http2 on;
        server_name api.atendehub.com;

        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        $connection_upgrade;

        location / {
            limit_req  zone=api_geral burst=100 nodelay;
            proxy_pass http://api;
        }

        # Login, cadastro e renovação de sessão: limite mais apertado
        location /api/v1/auth/ {
            limit_req  zone=api_auth burst=30 nodelay;
            proxy_pass http://api;
        }

        # Socket.IO (namespace /ws) — upgrade WebSocket e conexão longa.
        # Sem os timeouts, o nginx derrubava o socket após 60 s sem tráfego.
        location /socket.io/ {
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            proxy_buffering    off;
            proxy_pass         http://api;
        }
    }
}

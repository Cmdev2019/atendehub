# ─────────────────────────────────────────────────────────────────────────────
# AtendeHub — Override de produção
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Portas (B-55): só o nginx publica portas (80/443). Postgres, Redis,
# Evolution e API ficam acessíveis apenas pela rede interna atendehub_net.
# Não acrescente `ports` aos outros serviços: o Compose soma as listas ao
# combinar arquivos, e o check `compose-ports` da CI recusa o PR.
#
# Mídia (B-64): no Cloudflare R2, fora da stack — não há MinIO em produção.
# MEDIA_STORAGE_HOST (host S3 da conta, ex. <conta>.r2.cloudflarestorage.com)
# alimenta a API e o nginx de uma vez; ver "Storage de mídia (R2)" no RUNBOOK.
# ─────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório em produção}
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD obrigatório em produção} --appendonly yes
    deploy:
      resources:
        limits:
          memory: 512m

  evolution:
    restart: always
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:?EVOLUTION_SERVER_URL obrigatório em produção}       # ex: https://evolution.suaempresa.com
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY obrigatório em produção}
      WEBHOOK_GLOBAL_URL: ${EVOLUTION_WEBHOOK_URL:?EVOLUTION_WEBHOOK_URL obrigatório em produção}
    deploy:
      resources:
        limits:
          memory: 1g

  # ── NestJS API (build da imagem da aplicação) ────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: atendehub_api
    restart: always
    # B-44: o healthcheck vem da própria imagem (HEALTHCHECK em
    # apps/api/Dockerfile, batendo em /api/v1/health) — é ele que o nginx
    # espera abaixo.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # B-44: tempo para o desligamento gracioso (enableShutdownHooks) terminar
    # o job em andamento antes do SIGKILL. O padrão do Docker é 10 s.
    stop_grace_period: 30s
    env_file: .env
    # B-64: a API assina as URLs de mídia com o host do R2 — o mesmo para o
    # qual o nginx repassa o media.<domínio> —, então o endpoint sai daqui e
    # não do .env (um MINIO_ENDPOINT no .env é ignorado em produção). O bucket
    # é criado e mantido privado no painel do R2, não pela API.
    environment:
      MINIO_ENDPOINT: https://${MEDIA_STORAGE_HOST:?MEDIA_STORAGE_HOST obrigatório em produção, ex. <conta>.r2.cloudflarestorage.com}
      MINIO_MANAGE_BUCKET: "false"
    networks:
      - atendehub_net
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Nginx: build estático do front (Vite+React) + proxy reverso da API ──────
  # Sem container "web" separado — o front não roda servidor Node em produção,
  # é um build estático que o próprio nginx serve direto (ver F5-3/B6-2).
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:?VITE_API_URL obrigatório em produção, ex. https://api.atendehub.com/api/v1}"
        VITE_WS_URL: "${VITE_WS_URL:?VITE_WS_URL obrigatório em produção, ex. https://api.atendehub.com}"
        VITE_SENTRY_DSN: "${VITE_SENTRY_DSN:-}" # opcional (B-18) — vazio é um no-op seguro
    container_name: atendehub_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    # C-07/B-59/B-64: o nginx também serve a mídia (media.<domínio> → R2).
    # O host do R2 entra no upstream gerado no boot do container
    # (infra/nginx/templates/media-storage.conf.template).
    environment:
      MEDIA_STORAGE_HOST: ${MEDIA_STORAGE_HOST:?MEDIA_STORAGE_HOST obrigatório em produção, ex. <conta>.r2.cloudflarestorage.com}
    depends_on:
      api:
        condition: service_healthy
    networks:
      - atendehub_net

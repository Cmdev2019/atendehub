# ─────────────────────────────────────────────────────────────────────────────
# AtendeHub — Override de produção
# Uso: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Portas (B-55): só o nginx publica portas (80/443). Postgres, Redis, MinIO,
# Evolution e API ficam acessíveis apenas pela rede interna atendehub_net.
# Não acrescente `ports` aos outros serviços: o Compose soma as listas ao
# combinar arquivos, e o check `compose-ports` da CI recusa o PR.
# ─────────────────────────────────────────────────────────────────────────────

services:

  postgres:
    restart: always
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD obrigatório em produção}
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD obrigatório em produção} --appendonly yes
    deploy:
      resources:
        limits:
          memory: 512m

  minio:
    restart: always
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER obrigatório em produção}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD obrigatório em produção}
    deploy:
      resources:
        limits:
          memory: 512m

  evolution:
    restart: always
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:?EVOLUTION_SERVER_URL obrigatório em produção}       # ex: https://evolution.suaempresa.com
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:?EVOLUTION_API_KEY obrigatório em produção}
      WEBHOOK_GLOBAL_URL: ${EVOLUTION_WEBHOOK_URL:?EVOLUTION_WEBHOOK_URL obrigatório em produção}
    deploy:
      resources:
        limits:
          memory: 1g

  # ── NestJS API (build da imagem da aplicação) ────────────────────────────────
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: atendehub_api
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file: .env
    networks:
      - atendehub_net
    deploy:
      resources:
        limits:
          memory: 1g

  # ── Nginx: build estático do front (Vite+React) + proxy reverso da API ──────
  # Sem container "web" separado — o front não roda servidor Node em produção,
  # é um build estático que o próprio nginx serve direto (ver F5-3/B6-2).
  nginx:
    build:
      context: .
      dockerfile: infra/nginx/Dockerfile
      args:
        VITE_API_URL: "${VITE_API_URL:?VITE_API_URL obrigatório em produção, ex. https://api.atendehub.com/api/v1}"
        VITE_WS_URL: "${VITE_WS_URL:?VITE_WS_URL obrigatório em produção, ex. https://api.atendehub.com}"
        VITE_SENTRY_DSN: "${VITE_SENTRY_DSN:-}" # opcional (B-18) — vazio é um no-op seguro
    container_name: atendehub_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - api
    networks:
      - atendehub_net

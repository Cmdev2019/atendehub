version: 2
# B-87 (M-23): os grupos levam só minor/patch. Uma versão major chega num PR
# próprio — antes, um grupo misturava 17 atualizações com TypeScript 7,
# ESLint 10, Nest 12 e Prisma 7 juntos, impossível de mesclar.
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    labels: ["dependências", "web"]
    groups:
      # react e react-dom SEMPRE sobem juntos. Separados, o PR de `react`
      # sozinho quebrou 27 das 31 suítes (2026-07-28): o react-dom ficava na
      # versão anterior e a incompatibilidade estourava já no import do
      # @testing-library/react, antes de qualquer teste rodar.
      react:
        patterns: ["react", "react-dom", "@types/react", "@types/react-dom"]
        update-types: ["minor", "patch"]
      # Ferramental de teste também é acoplado entre si (jest + ambiente +
      # transformador): subir um item isolado costuma quebrar a suíte inteira.
      testing:
        patterns:
          - "jest"
          - "jest-*"
          - "babel-jest"
          - "@testing-library/*"
          - "identity-obj-proxy"
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/apps/api"
    schedule: { interval: weekly, day: monday }
    open-pull-requests-limit: 5
    commit-message: { prefix: "chore(deps)" }
    labels: ["dependências", "api"]
    groups:
      # B-92 (L-03): pacotes acoplados sobem juntos em qualquer tipo de
      # dependência (produção e desenvolvimento) — o grupo vem antes do
      # dev-dependencies, e o Dependabot usa o primeiro que casar.
      nestjs:
        patterns: ["@nestjs/*"]
        update-types: ["minor", "patch"]
      # B-86: o adapter do Postgres sai na mesma versão do cliente
      prisma:
        patterns: ["prisma", "@prisma/*"]
        update-types: ["minor", "patch"]
      dev-dependencies:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: docker
    directory: "/apps/api"
    schedule: { interval: monthly }
    # B-92 (L-03): Node ímpar nunca vira LTS — o PR do Node 25 foi um exemplo
    ignore:
      - dependency-name: "node"
        versions: ["25.x", "27.x", "29.x"]
    commit-message: { prefix: "chore(deps)" }
    labels: ["dependências", "docker"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    commit-message: { prefix: "chore(ci)" }
    labels: ["dependências", "ci"]

name: Nginx Check

# B-43: valida a configuração do nginx de produção antes do deploy. Constrói
# a imagem real (infra/nginx/Dockerfile — o mesmo build do
# docker-compose.prod.yml) e roda `nginx -t` dentro dela. Um erro de sintaxe
# ou um include faltando no Dockerfile derrubaria app e API de uma vez só no
# servidor; aqui ele aparece no PR.
on:
  push:
    branches: [master]
    paths:
      - 'infra/nginx/**'
      - '.github/workflows/nginx-check.yml'
  pull_request:
    paths:
      - 'infra/nginx/**'
      - '.github/workflows/nginx-check.yml'

concurrency:
  group: nginx-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nginx-config:
    name: nginx-config
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - name: Build da imagem do nginx
        run: |
          docker build -f infra/nginx/Dockerfile \
            --build-arg VITE_API_URL=https://api.atendehub.com/api/v1 \
            --build-arg VITE_WS_URL=https://api.atendehub.com \
            -t atendehub-nginx:ci .

      # Certificado descartável só para o nginx -t carregar o ssl_certificate.
      # O host `api` aponta para o loopback porque o nginx resolve esse
      # upstream já na validação; o do storage de mídia (B-64) usa `resolve`
      # e só é consultado com o nginx rodando.
      - name: nginx -t
        run: |
          certs=$(mktemp -d)
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=ci" \
            -keyout "$certs/privkey.pem" -out "$certs/fullchain.pem"
          docker run --rm --add-host api:127.0.0.1 \
            -e MEDIA_STORAGE_HOST=conta.r2.cloudflarestorage.com \
            -v "$certs:/etc/nginx/certs:ro" atendehub-nginx:ci nginx -T > nginx-T.txt
          # B-64: o upstream da mídia sai do template com o host do .env
          grep -q 'server conta.r2.cloudflarestorage.com:443 resolve;' nginx-T.txt
          grep -q 'default "conta.r2.cloudflarestorage.com";' nginx-T.txt
          echo "upstream do storage gerado a partir de MEDIA_STORAGE_HOST"

          # Sem a variável (ou com esquema no valor) o container não pode
          # subir: o nginx aceitaria o texto literal e a mídia daria 502.
          for host in "" "https://conta.r2.cloudflarestorage.com"; do
            if docker run --rm --add-host api:127.0.0.1 -e MEDIA_STORAGE_HOST="$host" \
                 -v "$certs:/etc/nginx/certs:ro" atendehub-nginx:ci nginx -t; then
              echo "::error::nginx subiu com MEDIA_STORAGE_HOST='$host'"
              exit 1
            fi
          done
          echo "MEDIA_STORAGE_HOST ausente ou inválido é recusado no boot"

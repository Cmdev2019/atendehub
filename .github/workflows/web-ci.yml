name: Web CI

# Sem filtro de `paths` de propósito. Com filtro, um PR que só toca docs/ não
# dispara este workflow, o status check `web` nunca é reportado, e a proteção
# de branch fica esperando para sempre ("Expected — Waiting for status to be
# reported"). O custo de rodar sempre é ~2 min; o de um PR travado é maior.
on:
  push:
    branches: [master]
  pull_request:

# Push novo na mesma ref cancela o run anterior — evita fila de runs obsoletos
# e libera o runner mais cedo.
concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Nome do job = nome do status check. Precisa ser distinto do job da API:
  # ambos se chamavam `build`, produzindo dois checks homônimos que a proteção
  # de branch não conseguia diferenciar.
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci

      # B-103 (L-14 / B-47): lint do front — erro de lint falha o job
      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build

      # B-89 (M-24): números do projeto contados do código, no resumo do job —
      # os documentos apontam para cá em vez de repetir contagens que envelhecem
      - name: Números do projeto
        run: node scripts/project-stats.mjs >> "$GITHUB_STEP_SUMMARY"

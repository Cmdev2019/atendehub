name: API CI

on:
  push:
    branches: [master]
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'
  pull_request:
    paths:
      - 'apps/api/**'
      - '.github/workflows/api-ci.yml'

defaults:
  run:
    working-directory: apps/api

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

name: API CI

# Sem filtro de `paths` de propósito — ver comentário equivalente em web-ci.yml.
on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: api-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  # Nome do job = nome do status check. Antes era `build` nos dois workflows,
  # o que gerava dois checks homônimos indistinguíveis para a proteção de branch.
  api:
    name: api
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/api/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint:check

      - name: Type check
        run: npx tsc --noEmit

      - name: Tests
        run: npm test

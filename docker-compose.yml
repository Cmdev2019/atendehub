# ─────────────────────────────────────────────────────────────────────────────
# AtendeHub — Infraestrutura local de desenvolvimento
# Sobe: PostgreSQL · Redis · Evolution API — e, em desenvolvimento, o MinIO
# (definido só no docker-compose.override.yml: em produção a mídia fica no
# Cloudflare R2, B-64)
# Uso: docker compose up -d
#
# Este arquivo NÃO publica portas (B-55). Em desenvolvimento, o
# `docker compose up` carrega sozinho o docker-compose.override.yml, que
# publica as portas só em 127.0.0.1. Em produção o deploy usa `-f` explícito
# (ver docker-compose.prod.yml), o override não entra e só o nginx publica
# portas. Motivo: o Compose SOMA as listas de `ports` ao combinar arquivos —
# um `ports: []` no override de produção não remove as portas daqui.
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── PostgreSQL 16 ───────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: atendehub_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-atendehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-atendehub_secret}
      POSTGRES_DB: ${POSTGRES_DB:-atendehub}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-atendehub}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atendehub_net

  # ── Redis 7 ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: atendehub_redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_secret} --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_secret}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - atendehub_net

  # ── Storage de mídia ─────────────────────────────────────────────────────────
  # Não fica neste arquivo (B-64): em desenvolvimento é o MinIO do
  # docker-compose.override.yml; em produção, o Cloudflare R2, fora da stack.

  # ── Evolution API v2 (camada WhatsApp / Baileys) ─────────────────────────────
  evolution:
    image: evoapicloud/evolution-api:v2.3.4
    container_name: atendehub_evolution
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SERVER_URL: ${EVOLUTION_SERVER_URL:-http://localhost:8080}
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-evolution_api_key_dev}
      AUTHENTICATION_EXPOSE_IN_FETCH_INSTANCES: "true"
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      # Banco DEDICADO da Evolution — não pode compartilhar o banco da API:
      # ambos usam Prisma e colidem na tabela _prisma_migrations (crash-loop)
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-atendehub}:${POSTGRES_PASSWORD:-atendehub_secret}@postgres:5432/evolution
      DATABASE_CONNECTION_CLIENT_NAME: evolution_api
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://:${REDIS_PASSWORD:-redis_secret}@redis:6379
      CACHE_REDIS_PREFIX_KEY: evolution
      WEBHOOK_GLOBAL_URL: ${EVOLUTION_WEBHOOK_URL:-http://host.docker.internal:3001/api/v1/webhooks/evolution}
      WEBHOOK_GLOBAL_ENABLED: "true"
      WEBHOOK_GLOBAL_WEBHOOK_BY_EVENTS: "false"
      WEBHOOK_EVENTS_MESSAGES_UPSERT: "true"
      WEBHOOK_EVENTS_MESSAGES_UPDATE: "true"
      WEBHOOK_EVENTS_MESSAGES_DELETE: "true"
      WEBHOOK_EVENTS_SEND_MESSAGE: "true"
      WEBHOOK_EVENTS_CONTACTS_UPSERT: "true"
      WEBHOOK_EVENTS_CONNECTION_UPDATE: "true"
      WEBHOOK_EVENTS_QRCODE_UPDATED: "true"
      # Mídia: a Evolution NÃO grava no storage (B-64). A API baixa cada mídia
      # pela própria Evolution (getBase64FromMediaMessage) e guarda no bucket
      # dela. As variáveis STORAGE_* que ficavam aqui nunca valeram (a v2 só
      # lê S3_*). Não ligar o S3 da Evolution no bucket da API: no boot ela
      # aplica leitura ANÔNIMA no bucket (s3:GetObject para "*") a menos que
      # S3_SKIP_POLICY=true, e ainda duplicaria a mídia dos contatos (LGPD).
    volumes:
      - evolution_data:/evolution/instances
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - atendehub_net

# ─── Volumes ──────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
  redis_data:
  evolution_data:

# ─── Redes ────────────────────────────────────────────────────────────────────
networks:
  atendehub_net:
    driver: bridge
